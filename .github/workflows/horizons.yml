name: Fetch Horizons data
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fetch_horizons.py --html index.html --out horizons_data.json
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add horizons_data.json
          git commit -m "Update Horizons data" || echo "no changes"
          git push
